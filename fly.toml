# fly.toml app configuration file generated for bmcf-league on 2026-07-20T18:06:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bmcf-league'
primary_region = 'ams'

[build]

[env]
  AUTO_SYNC = 'true'
  AUTO_SYNC_MINUTES = '180'
  DB_PATH = '/data/league.db'
  NODE_ENV = 'production'
  SLEEPER_LEAGUE_ID = '1382410388192120832'

[[mounts]]
  source = 'bmcf_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
