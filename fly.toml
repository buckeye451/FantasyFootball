# fly.toml app configuration file generated for bmcf-league on 2026-07-20T18:06:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bmcf-league'
primary_region = 'ord'

[build]

[env]
  AUTO_SYNC = 'true'
  AUTO_SYNC_MINUTES = '180'
  DB_PATH = '/data/league.db'
  NODE_ENV = 'production'
  # Comma-separated Sleeper league ids, one per season (2026, 2025, 2024, 2023).
  # The sync also follows each league's previous-season chain automatically.
  SLEEPER_LEAGUE_ID = '1382410388192120832,1181309188575956992,1124818253726633984,989593232034095104'

[[mounts]]
  source = 'bmcf_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Never scale the last machine to zero: the first visit after a quiet spell
  # doesn't wait on a cold start, and the background sync keeps running when
  # nobody is on the site.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  # Headroom, not a steady-state requirement: the server idles around 110MB,
  # but a burst of concurrent dynamic renders was measured peaking at 270MB.
  # Fly OOM-kills silently, and a kill mid-response surfaces as the proxy's
  # "could not finish reading HTTP body" with the page loading forever, so the
  # spare room turns a hard failure into a slow one.
  memory = '1gb'
