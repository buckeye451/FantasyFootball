name: Deploy to Fly.io

# Runs entirely on GitHub's servers — you never need flyctl on your own computer.
# Trigger it from the browser: Actions tab → "Deploy to Fly.io" → Run workflow.
# It also runs automatically when you push to the default branch.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/bmcf24league-access-33xz3j

jobs:
  # Gate the deploy on the token being present, so a run before you've added the
  # FLY_API_TOKEN secret ends green-with-a-warning instead of a scary red X.
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - id: token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=One-time setup needed::Add your Fly token as the FLY_API_TOKEN repository secret (Settings → Secrets and variables → Actions), then re-run this workflow. See the README's Fly.io section."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'yes'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create the app and volume if they don't exist, then deploy
        run: |
          set -e
          # Pull app + region out of fly.toml, tolerating either quote style
          # (Fly Launch writes single quotes; hand-edits sometimes use double).
          APP=$(sed -n "s/^app *= *['\"]\\(.*\\)['\"].*/\\1/p" fly.toml)
          REGION=$(sed -n "s/^primary_region *= *['\"]\\(.*\\)['\"].*/\\1/p" fly.toml)
          echo "App: $APP   Region: $REGION"

          # First run creates the app; later runs no-op. --org personal is right
          # for a personal Fly signup; change it if you deploy into a named org.
          flyctl apps create "$APP" --org personal || echo "App already exists (or the name is taken) — continuing."

          # Create the SQLite volume once, scoped to the primary region. Fly
          # volumes are pinned to a region, so a volume that exists only in an
          # old region must NOT satisfy this check — otherwise a region change
          # would deploy a machine with no volume in its region to attach to.
          if ! flyctl volumes list --app "$APP" --json | jq -e --arg r "$REGION" '.[] | select(.name=="bmcf_data" and .region==$r)' >/dev/null 2>&1; then
            echo "Creating volume bmcf_data ($REGION)…"
            flyctl volumes create bmcf_data --size 1 --region "$REGION" --app "$APP" --yes
          else
            echo "Volume bmcf_data already exists in $REGION."
          fi

          flyctl deploy --remote-only

      - name: Show the app URL
        run: |
          APP=$(sed -n "s/^app *= *['\"]\\(.*\\)['\"].*/\\1/p" fly.toml)
          echo "Deployed. Your app is at: https://$APP.fly.dev"
          echo "### :rocket: Deployed to https://$APP.fly.dev" >> "$GITHUB_STEP_SUMMARY"
